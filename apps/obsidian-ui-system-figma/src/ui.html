<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html { background: #fff; }
    body { font: 13px system-ui, sans-serif; margin: 20px; color: #222; }
    h1 { font-size: 16px; margin: 0 0 8px; }
    p { color: #555; line-height: 1.4; margin: 0 0 16px; }
    label { display: block; font-weight: 600; margin: 12px 0; }
    input { display: block; width: 100%; margin-top: 5px; box-sizing: border-box; }
    #typography { margin-top: 14px; min-height: 20px; }
    button { margin-top: 10px; padding: 8px 12px; cursor: pointer; }
    #status { margin-top: 14px; min-height: 36px; white-space: pre-wrap; }
    #status.error { color: #b42318; }
    #status.success { color: #067647; }
  </style>
</head>
<body>
  <h1>Obsidian UI System</h1>
  <p>Selecione o pacote exportado pelo comando do Obsidian.</p>
  <label>Figma Package <input id="package" type="file" accept=".zip,application/zip"></label>
  <div id="summary" role="status" aria-live="polite"></div>
  <button id="generate" type="button" disabled>Generate UI Kit</button>
  <div id="typography" role="status" aria-live="polite"></div>
  <div id="status" role="status" aria-live="polite"></div>
  <script>
    const packageInput = document.getElementById('package');
    const generate = document.getElementById('generate');
    const summary = document.getElementById('summary');
    const typography = document.getElementById('typography');
    const status = document.getElementById('status');
    let requestId = 0;
    let ready = false;
    let generating = false;

    function show(text, kind = '') {
      status.textContent = text;
      status.className = kind;
    }

    function readZip(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('Não foi possível ler o ZIP selecionado.'));
        reader.onload = () => resolve(new Uint8Array(reader.result));
        reader.readAsArrayBuffer(file);
      });
    }

    packageInput.onchange = async () => {
      const id = ++requestId;
      ready = false;
      generate.disabled = true;
      summary.textContent = '';
      typography.textContent = '';
      parent.postMessage({ pluginMessage: { type: 'clear-package', requestId: id } }, '*');
      const file = packageInput.files[0];
      if (!file) { show('Selecione um Figma Package .zip.'); return; }
      if (!file.name.toLowerCase().endsWith('.zip')) {
        show('Selecione um arquivo .zip exportado pelo Obsidian.', 'error');
        return;
      }
      show('Lendo e validando Figma Package…');
      try {
        const bytes = await readZip(file);
        if (id !== requestId) return;
        parent.postMessage({ pluginMessage: { type: 'load-package', requestId: id, bytes } }, '*');
      } catch (error) {
        if (id === requestId) show(error.message || String(error), 'error');
      }
    };

    generate.onclick = () => {
      if (!ready || generating) return;
      generating = true;
      generate.disabled = true;
      packageInput.disabled = true;
      typography.textContent = '';
      show('Verificando tipografia e gerando UI Kit…');
      parent.postMessage({ pluginMessage: { type: 'generate-ui-kit' } }, '*');
    };

    onmessage = (event) => {
      const message = event.data.pluginMessage;
      if (message?.type === 'package-ready' && message.requestId === requestId) {
        ready = true;
        summary.textContent = `Obsidian ${message.summary.obsidianVersion}\n` +
          `${message.summary.specimens} specimens · ${message.summary.tokens} tokens\nLayout model ready`;
        summary.style.whiteSpace = 'pre-line';
        generate.disabled = generating;
        show('Pacote pronto.');
      }
      if (message?.type === 'package-error' && message.requestId === requestId) {
        ready = false;
        generate.disabled = true;
        show(message.text, 'error');
      }
      if (message?.type === 'typography') typography.textContent = message.text;
      if (message?.type === 'result') {
        if (!message.ok) typography.textContent = '';
        show(message.text, message.ok ? 'success' : 'error');
        generating = false;
        packageInput.disabled = false;
        generate.disabled = !ready;
      }
    };
  </script>
</body>
</html>
