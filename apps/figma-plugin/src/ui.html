<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html { background: #fff; }
    body { font: 13px system-ui, sans-serif; margin: 20px; color: #222; }
    h1 { font-size: 16px; margin: 0 0 8px; }
    p { color: #555; line-height: 1.4; margin: 0 0 16px; }
    label { display: block; font-weight: 600; margin: 12px 0; }
    input { display: block; width: 100%; margin-top: 5px; box-sizing: border-box; }
    fieldset { border: 1px solid #bbb; margin: 14px 0 4px; padding: 6px 10px; }
    legend { font-weight: 600; }
    .mode { display: flex; align-items: flex-start; gap: 7px; margin: 6px 0; font-weight: 400; }
    .mode input { width: auto; margin: 2px 0 0; }
    .hint { color: #555; font-size: 11px; line-height: 1.35; margin: 5px 0 0; }
    #typography { margin-top: 14px; min-height: 20px; }
    button { margin-top: 10px; padding: 8px 12px; cursor: pointer; }
    #status { margin-top: 14px; min-height: 36px; white-space: pre-wrap; }
    #status.error { color: #b42318; }
    #status.success { color: #067647; }
  </style>
</head>
<body>
  <h1>Obsidian UI System</h1>
  <p>Spike de ButtonComponent. Selecione os JSONs do Atlas e do Layout Lab do mesmo ambiente.</p>
  <label>Atlas components.json <input id="components" type="file" accept=".json,application/json"></label>
  <label>Layout Lab layout.json <input id="layout" type="file" accept=".json,application/json"></label>
  <fieldset>
    <legend>Typography mode</legend>
    <label class="mode"><input type="radio" name="mode" value="strict" checked> Strict — fonte exigida</label>
    <label class="mode"><input type="radio" name="mode" value="lab"> Lab — Inter / Regular placeholder</label>
    <p class="hint">Lab valida variants, Auto Layout, texto editável e importação. A fonte não representa o Obsidian.</p>
  </fieldset>
  <button id="generate" type="button">Generate Button</button>
  <div id="typography" role="status" aria-live="polite"></div>
  <div id="status" role="status" aria-live="polite"></div>
  <script>
    const componentsInput = document.getElementById('components');
    const layoutInput = document.getElementById('layout');
    const generate = document.getElementById('generate');
    const typography = document.getElementById('typography');
    const status = document.getElementById('status');
    const modeInputs = document.querySelectorAll('input[name="mode"]');

    modeInputs.forEach((input) => input.onchange = () => {
      generate.textContent = input.checked && input.value === 'lab' ? 'Generate Button [Lab]' : 'Generate Button';
      typography.textContent = '';
      show('');
    });

    function show(text, kind = '') {
      status.textContent = text;
      status.className = kind;
    }

    function readJson(file, label) {
      return new Promise((resolve, reject) => {
        if (!file) return reject(new Error(`${label}: selecione um arquivo JSON.`));
        const reader = new FileReader();
        reader.onerror = () => reject(new Error(`${label}: não foi possível ler o arquivo.`));
        reader.onload = () => {
          try { resolve(JSON.parse(String(reader.result))); }
          catch { reject(new Error(`${label}: JSON inválido.`)); }
        };
        reader.readAsText(file);
      });
    }

    generate.onclick = async () => {
      generate.disabled = true;
      typography.textContent = '';
      show('Lendo arquivos…');
      try {
        const [components, layout] = await Promise.all([
          readJson(componentsInput.files[0], 'Atlas components.json'),
          readJson(layoutInput.files[0], 'Layout Lab layout.json'),
        ]);
        const mode = document.querySelector('input[name="mode"]:checked').value;
        show(mode === 'lab' ? 'Gerando Button [Lab] com tipografia placeholder…' : 'Verificando tipografia exigida e gerando Button…');
        parent.postMessage({ pluginMessage: { type: 'generate-button', components, layout, mode } }, '*');
      } catch (error) {
        show(error.message || String(error), 'error');
        generate.disabled = false;
      }
    };

    onmessage = (event) => {
      const message = event.data.pluginMessage;
      if (message?.type === 'typography') typography.textContent = message.text;
      if (message?.type === 'result') {
        if (!message.ok && (message.text.startsWith('Required font ') || message.text.startsWith('Lab placeholder ')))
          typography.textContent = message.text;
        show(message.text, message.ok ? 'success' : 'error');
        generate.disabled = false;
      }
    };
  </script>
</body>
</html>
